[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-eval-harness"
version = "0.1.0"
description = "Measure AI systems properly: labelled datasets, deterministic and judge scorers, repeated runs, statistics, run comparison and CI gates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sujyonta Kumar Giri" }]
keywords = ["evaluation", "llm", "ai-agents", "evals", "testing", "quality-engineering", "regression-testing", "benchmark"]
dependencies = []

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
aieval = "ai_eval_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/ai_eval_harness/report.py" = ["E501"]
